[project]
name = "snc-sf"
version = "1.0.0"
description = ""
authors = [
    {name = "imedan",email = "ilija.medan@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "astropy (>=7.0.0)",
    "numpy (>=2.2.4)",
    "matplotlib (>=3.10.1)",
    "healpy (>=1.18.1)",
    "tqdm (>=4.67.1)",
    "sdss-semaphore (>=0.2.4,<0.3.0)",
    "gaiaunlimited (>=0.3.0,<0.4.0)",
    "polars (>=1.32.2)",
    "jax (>=0.7.0,<0.8.0)",
    "notebook (>=7.4.5)",
    "jaxopt (>=0.8.5,<0.9.0)",
    "optax (>=0.2.5,<0.3.0)",
    "numpyro (>=0.19.0,<0.20.0)",
    "pyarrow (>=21.0.0)",
    "astroquery (>=0.4.11)",
    "scipy (>=1.17.0)",
]

[tool.poetry]
packages = [{include = "snc_sf", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
